# Web de comunidad de Angels Online: sitio estatico + proxy a la API de registro de cuenta.
# aoforever.tech va por https (Let's Encrypt, certbot.timer lo renueva); por la IP sigue en http.

# Por la IP (y cualquier otro nombre): la web en http, como antes.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/angels-web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/cuenta/ {
        proxy_pass http://127.0.0.1:8281/api/cuenta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# El dominio por http: a https (menos el reto de Let's Encrypt al renovar).
server {
    listen 80;
    listen [::]:80;
    server_name aoforever.tech www.aoforever.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/angels-web;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aoforever.tech www.aoforever.tech;

    ssl_certificate /etc/letsencrypt/live/aoforever.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aoforever.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/angels-web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/cuenta/ {
        proxy_pass http://127.0.0.1:8281/api/cuenta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
