# Web de comunidad de Angels Online: sitio estatico + proxy a la API de registro de cuenta.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/angels-web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/cuenta/ {
        proxy_pass http://127.0.0.1:8281/api/cuenta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
