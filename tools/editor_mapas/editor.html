<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de mapas FAO / Dos Coronas</title>
<style>
:root{--bg:#10121a;--p:#161926;--p2:#1c2030;--p3:#252a3f;--tx:#e6e8f2;--mu:#8a90a8;--ac:#6ea8ff;--bd:#2a2f46;--ok:#58c27d;--mal:#e86a6a;--av:#e8b84f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--p2);border:1px solid var(--bd);padding:5px 10px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ac)}.btn.on{background:var(--ac);color:#06101f;border-color:var(--ac)}.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 7px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:4px 6px}
input[type=number]{width:70px}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#0b0d14;border-bottom:1px solid var(--bd)}
header b{margin-right:6px}.sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
main{display:grid;grid-template-columns:56px 1fr 340px;min-height:0}
#tools{background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;padding:6px;overflow:auto}
#tools .btn{padding:6px 0;text-align:center;font-size:11px;line-height:1.15}
#tools .btn span{display:block;font-size:17px}
#cv{position:relative;min-width:0;min-height:0;background:#07080c}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#mini{position:absolute;right:10px;bottom:10px;border:1px solid var(--bd);background:#000;cursor:pointer;image-rendering:pixelated;box-shadow:0 2px 10px #000a}
#hud{position:absolute;left:8px;bottom:8px;background:#0b0d14cc;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;color:var(--mu);font-size:12px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:#0b0d14ee;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:12px;display:none;z-index:5}
#side{background:var(--p);border-left:1px solid var(--bd);display:grid;grid-template-rows:auto 1fr;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--bd)}
#tabs .btn{padding:3px 7px;font-size:12px}
#panel{overflow:auto;padding:8px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sw{border:2px solid transparent;border-radius:6px;cursor:pointer;background:#000;aspect-ratio:1;position:relative;overflow:hidden}
.sw.on{border-color:var(--ac)}.sw span{position:absolute;left:2px;bottom:1px;font-size:10px;background:#000a;padding:0 3px;border-radius:3px}
.olist{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.oit{border:2px solid transparent;border-radius:6px;background:var(--p2);cursor:pointer;padding:3px;text-align:center;overflow:hidden}
.oit.on{border-color:var(--ac)}.oit .th{height:62px;display:flex;align-items:center;justify-content:center}.oit img{max-width:100%;max-height:62px}
.oit .nm{font-size:10px;color:var(--mu);word-break:break-all;line-height:1.1;max-height:24px;overflow:hidden}
.att{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;cursor:pointer;margin:3px 0}.att.on{border-color:var(--ac);background:var(--p3)}
.att i{width:16px;height:16px;border-radius:3px;display:inline-block}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{border-bottom:1px solid var(--bd);padding:3px 4px;text-align:left}
.tbl tr.sel{background:var(--p3)}.tbl tr{cursor:pointer}
textarea.big{width:100%;height:320px;font:11px ui-monospace,Consolas,monospace;white-space:pre}
footer{padding:3px 10px;background:#0b0d14;border-top:1px solid var(--bd);color:var(--mu);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
#modal>div{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:14px;width:min(760px,94vw);max-height:86vh;overflow:auto}
.ok{color:var(--ok)}.mal{color:var(--mal)}.av{color:var(--av)}
h4{margin:10px 0 4px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
</style>

<header>
  <b>Editor de mapas</b>
  <button class="btn" id="bAbrir">Abrir…</button><button class="btn" id="bNuevo">Nuevo</button>
  <button class="btn" id="bGuardar">Guardar proyecto</button><button class="btn" id="bExportar">Exportar .mpc</button><button class="btn" id="bDC">Enviar a Dos Coronas</button>
  <div class="sep"></div>
  <button class="btn" id="bUndo" title="Ctrl+Z">↶</button><button class="btn" id="bRedo" title="Ctrl+Y">↷</button>
  <div class="sep"></div>
  <button class="btn" id="bZoomM">−</button><span id="zlbl" class="mu">50%</span><button class="btn" id="bZoomP">+</button><button class="btn" id="bAjustar">Ajustar</button>
  <div class="sep"></div>
  <span class="mu" id="titulo">sin mapa</span><span id="dirty" class="av"></span>
  <a class="btn" href="/dc" style="margin-left:auto;text-decoration:none">Editor de mapas de Dos Coronas →</a>
</header>

<main>
  <div id="tools"></div>
  <div id="cv"><canvas id="map"></canvas><canvas id="mini" width="220" height="140"></canvas><div id="hud"></div><div id="tip"></div></div>
  <div id="side"><div id="tabs"></div><div id="panel"></div></div>
</main>
<footer id="foot"><span id="msg">Abre un mapa o crea uno nuevo.</span></footer>
<div id="modal"><div id="modalbox"></div></div>
<script src="/static/editor.js"></script>
